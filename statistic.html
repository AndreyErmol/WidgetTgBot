<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:12px;font-family:system-ui;color:var(--tg-theme-text-color)}h3{margin:0;font-size:17px}.hint{font-size:11px;color:var(--tg-theme-hint-color)}.tabs,.cards,.nav,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{margin:12px 0}.tabs button{flex:1;padding:7px}.active{color:var(--tg-theme-accent-text-color);font-weight:bold}.cards{margin:12px 0}.card{flex:1;padding:10px;border-radius:12px;background:var(--tg-theme-secondary-bg-color)}.number{display:block;font-size:25px;font-weight:bold}.row{height:45px;border-bottom:1px solid var(--tg-theme-section-separator-color)}.name{font-size:13px;font-weight:bold;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clock{font-family:monospace;font-size:12px}.nav{margin-top:10px}.nav button{padding:5px 10px}.footer{margin-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));padding-right:max(12px,var(--tg-content-safe-area-corner-right))}
</style><h3>Статистика /widget</h3><div class="hint">Админ-панель · время МСК</div><div class="tabs"><button id="today">Сегодня</button><button id="yesterday">Вчера</button></div><div id="date" class="hint"></div><div class="cards"><div class="card"><span class="number" id="users">0</span><span class="hint">Пользователей</span></div><div class="card"><span class="number" id="calls">0</span><span class="hint">Вызовов /widget</span></div></div><div class="hint">Последние вызовы · админы исключены</div><div id="rows"></div><div class="nav"><button id="prev">Позже</button><span id="range" class="hint"></span><button id="next">Ранее</button></div><div id="status" class="hint footer">Снимок на момент запроса</div><script>
const W=window.TelegramWidget;let S=JSON.parse(W.chatData||'null'),busy=false,previous=[];
function text(id,v){document.getElementById(id).textContent=v;}
function draw(){if(!S)return;text('date',S.date);text('users',S.users);text('calls',S.calls);const root=document.getElementById('rows');root.textContent='';S.rows.forEach(function(r){const row=document.createElement('div');row.className='row';const left=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=r[1]?'@'+r[1]:'Без ника';const id=document.createElement('div');id.className='hint';id.textContent='ID '+r[0];left.appendChild(name);left.appendChild(id);const clock=document.createElement('span');clock.className='clock';clock.textContent=r[2];row.appendChild(left);row.appendChild(clock);root.appendChild(row);});if(!S.calls)root.textContent='В этот день запросов не было';text('range',S.calls?(S.offset+1)+'–'+(S.offset+S.rows.length)+' из '+S.calls:'0 вызовов');['today','yesterday'].forEach(function(id,i){document.getElementById(id).className=S.day===i?'active':'';document.getElementById(id).disabled=busy;});document.getElementById('prev').disabled=busy||!previous.length;document.getElementById('next').disabled=busy||S.offset+S.rows.length>=S.calls;}
function ask(day,offset,back){if(busy)return;busy=true;draw();text('status','Загрузка…');W.request('stats:'+day+':'+offset).then(function(a){busy=false;if(a.result){const n=JSON.parse(a.result);if(n.day!==S.day||(!back&&offset===0))previous=[];else if(back)previous.pop();else if(n.offset>S.offset)previous.push(S.offset);S=n;text('status','Снимок на момент запроса');draw();}else{S=null;['today','yesterday','prev','next'].forEach(function(id){document.getElementById(id).disabled=true;});text('range','');document.getElementById('rows').textContent='Доступ недоступен';text('users','—');text('calls','—');text('status','Доступ не подтверждён');}},function(){busy=false;text('status','Не удалось загрузить. Повторите нажатие.');draw();});}
document.getElementById('today').onclick=function(){ask(0,0,false);};document.getElementById('yesterday').onclick=function(){ask(1,0,false);};document.getElementById('prev').onclick=function(){ask(S.day,previous[previous.length-1],true);};document.getElementById('next').onclick=function(){ask(S.day,S.offset+S.rows.length,false);};draw();
</script>
