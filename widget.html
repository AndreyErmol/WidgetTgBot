<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:0;font-family:system-ui;color:var(--tg-theme-text-color)}.wrap{padding:12px}.head,.row,.left,.nav,.foot{display:flex;align-items:center;justify-content:space-between}.head{margin-bottom:8px}.title{font-size:16px;font-weight:bold}.left{justify-content:flex-start;gap:8px;min-width:0}.row{height:53px;border-bottom:1px solid var(--tg-theme-section-separator-color)}b{font-size:14px}.right{text-align:right;flex-shrink:0}small{display:block;font-size:10px;color:var(--tg-theme-hint-color);margin-top:3px}.name{display:block;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;color:#fff;font-weight:bold;flex-shrink:0}.nav{justify-content:center;gap:16px;margin:8px 0}.nav button{padding:3px 15px}.foot{font-size:11px;border-top:1px solid var(--tg-theme-section-separator-color);padding-top:8px}.time{font-size:10px;color:var(--tg-theme-hint-color);padding-top:6px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-right:max(12px,var(--tg-content-safe-area-corner-right))}.source{font-size:10px;color:var(--tg-theme-hint-color);margin-bottom:5px}.up{color:#228754}.down{color:#cf6269}#lamp{width:7px;height:7px;border-radius:4px;background:#228754;animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{background-color:#228754}50%{background-color:#000000}}
</style><div class="wrap"><div class="head"><span class="title">CryptunaPriceWidget</span><span id="lamp"></span></div><div class="source" id="source">Binance Spot · цены в USDT</div>
<div id="rows"></div><div class="nav"><button id="prev">‹</button><small id="page">1 / 3</small><button id="next">›</button></div><div class="foot"><span>USD/RUB · Coinbase</span><b id="fx">—</b></div><div class="time" id="time">—</div></div><script>
const W=window.TelegramWidget;let S={r:0,q:[],t:0,f:null},page=0,pending=false;
const N={BTC:'Bitcoin',ETH:'Ethereum',BNB:'BNB',XRP:'XRP',SUI:'Sui',SOL:'Solana',TRX:'TRON',HYPE:'Hyperliquid',GRAM:'Gram',DOGE:'Dogecoin',XAU:'Золото',XPD:'Палладий',XAG:'Серебро'};
const COLORS=['#b57412','#7063ad','#187c75','#45678e','#ae556a','#627b37'];
function text(id,t){document.getElementById(id).textContent=t;}
function add(tag,parent,cls,id){const e=document.createElement(tag);if(cls)e.className=cls;if(id)e.id=id;parent.appendChild(e);return e;}
const rows=document.getElementById('rows'),R=[];
for(let i=0;i<5;i++){const row=add('div',rows,'row');R.push(row);const left=add('div',row,'left');add('span',left,'badge','b'+i);const info=add('div',left);add('b',info,'name','n'+i);add('small',info,'','s'+i);const right=add('div',row,'right');add('b',right,'','p'+i);add('small',right,'','c'+i);}
function clock(t){const d=new Date(t*1000);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>('0'+n).slice(-2)).join(':');}
function draw(){text('source',page<2?'Binance Spot · цены в USDT':'Binance Futures · USDT за тройскую унцию');for(let i=0;i<5;i++){const q=S.q[page*5+i],has=!!q,valid=has&&q[2]!==null,name=has?(N[q[1]]||q[1]):'';R[i].style.visibility=has?'visible':'hidden';text('n'+i,name);text('s'+i,has?(q[5]?'Получено '+clock(q[5]):'Нет данных'):'');text('p'+i,has?(valid?q[2]+' USDT':'—'):'');text('c'+i,has?(valid&&q[3]!==null?q[3]+' за 24 ч':'Нет данных'):'');document.getElementById('c'+i).className=valid?(q[4]?'up':'down'):'';text('b'+i,name.slice(0,1));document.getElementById('b'+i).style.backgroundColor=has?COLORS[q[0]%6]:'#45678e';}text('page',(page+1)+' / 3');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===2;text('fx',S.f?'₽ '+S.f:'—');text('time',S.t?'Получено от: '+clock(S.t):'Котировки пока недоступны');}
function accept(raw){try{const n=JSON.parse(raw||'null');if(n&&n.r>=S.r)S=n;}catch(e){}draw();}
function refresh(){if(pending)return;pending=true;try{W.request('refresh').then(function(a){pending=false;if(a.result)accept(a.result);},function(){pending=false;});}catch(e){pending=false;}}
document.getElementById('prev').onclick=function(){if(page>0)page--;draw();};document.getElementById('next').onclick=function(){if(page<2)page++;draw();};W.onEvent('publicDataChanged',function(){accept(W.publicData);});W.watchPublicData();accept(W.publicData);refresh();setInterval(refresh,10000);
</script>
