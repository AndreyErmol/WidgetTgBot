body{margin:0;padding:0;font-family:system-ui;color:var(--tg-theme-text-color)}.wrap{padding:12px}.head,.row,.left,.nav,.foot{display:flex;align-items:center;justify-content:space-between}.head{gap:5px;margin-bottom:8px}.title{font-size:15px;font-weight:bold}.left{justify-content:flex-start;gap:8px;min-width:0}.row{height:53px;border-bottom:1px solid var(--tg-theme-section-separator-color)}b{font-size:14px}.right{text-align:right;flex-shrink:0}small{display:block;font-size:10px;color:var(--tg-theme-hint-color);margin-top:3px}.left b{display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.left img{flex-shrink:0}.nav{justify-content:center;gap:16px;margin:8px 0}.nav button{padding:3px 15px}.foot{font-size:11px;border-top:1px solid var(--tg-theme-section-separator-color);padding-top:8px}.time{font-size:10px;color:var(--tg-theme-hint-color);padding-top:6px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-right:max(12px,var(--tg-content-safe-area-corner-right))}.up{color:#228754}.down{color:#cf6269}#lamp{width:6px;height:6px;border-radius:3px;background:var(--tg-theme-hint-color)}#lamp.live{background:#228754;animation:pulse 2s infinite}#whale{animation:swim 3s ease-in-out infinite;flex-shrink:0}@keyframes pulse{50%{opacity:.35}}@keyframes swim{50%{transform:translateY(-2px) rotate(-5deg)}}@media(prefers-reduced-motion:reduce){#whale,#lamp.live{animation:none}}

__ROWS__
<div class="nav"><button id="prev">‹</button><small id="page">1 / 2</small><button id="next">›</button></div><div class="foot"><span>USD/RUB · Coinbase</span><b id="fx">—</b></div><div class="time" id="time">—</div></div><script>
const W=window.TelegramWidget,C=__COINS__;let S={r:0,q:[],t:0,f:[null,0]},page=0;
function text(id,t){document.getElementById(id).textContent=t;}
function num(n){return Number(n).toFixed(Number(n)<.01?6:2).replace(/\B(?=(\d{3})+(?!\d))/g,' ').replace('.',',');}
function clock(t){const d=new Date(t*1000);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>('0'+n).slice(-2)).join(':');}
function draw(){C.forEach(function(c,i){const q=S.q.find(q=>q[0]===c[0]);document.getElementById('row'+i).style.display=Math.floor(i/5)===page?'flex':'none';if(q){text('p'+i,'$ '+num(q[2]));text('c'+i,(q[3]>=0?'+':'')+num(q[3])+'% за 24 ч');document.getElementById('c'+i).className=q[3]>=0?'up':'down';text('sub'+i,'#'+q[1]+' · '+c[1]+(c[2]?' · закреплена':''));}});text('page',(page+1)+' / 2');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===1;if(S.f[0])text('fx','₽ '+num(S.f[0]));text('time',S.t?'CMC · получено '+clock(S.t):'CMC');document.getElementById('lamp').className=S.t&&Date.now()/1000-S.t<45?'live':'';}
document.getElementById('prev').onclick=function(){page=0;draw();};document.getElementById('next').onclick=function(){page=1;draw();};
function receive(){try{const n=JSON.parse(W.publicData||'null');if(n&&n.r>=S.r)S=n;}catch(e){}draw();}W.onEvent('publicDataChanged',receive);W.watchPublicData();receive();setInterval(draw,1000);
</script>
