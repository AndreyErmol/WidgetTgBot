<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:0;font-family:system-ui;color:var(--tg-theme-text-color)}.wrap{padding:12px}.head,.row,.left,.nav,.foot{display:flex;align-items:center;justify-content:space-between}.head{margin-bottom:8px}.title{font-size:16px;font-weight:bold}.left{justify-content:flex-start;gap:8px;min-width:0}.row{height:53px;border-bottom:1px solid var(--tg-theme-section-separator-color)}b{font-size:14px}.right{text-align:right;flex-shrink:0}small{display:block;font-size:10px;color:var(--tg-theme-hint-color);margin-top:3px}.name{display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;color:#fff;font-weight:bold;flex-shrink:0}.nav{justify-content:center;gap:16px;margin:8px 0}.nav button{padding:3px 15px}.foot{font-size:11px;border-top:1px solid var(--tg-theme-section-separator-color);padding-top:8px}.time{font-size:10px;color:var(--tg-theme-hint-color);padding-top:6px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-right:max(12px,var(--tg-content-safe-area-corner-right))}.up{color:#228754}.down{color:#cf6269}#lamp{width:7px;height:7px;border-radius:4px;background:#228754;animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{background-color:#228754}50%{background-color:#000000}}
</style><div class="wrap"><div class="head"><span class="title">CryptunaPriceWidget</span><span id="lamp"></span></div>
<div id="rows"></div><div class="nav"><button id="prev">‹</button><small id="page">1 / 2</small><button id="next">›</button></div><div class="foot"><span>USD/RUB · Coinbase</span><b id="fx">—</b></div><div class="time" id="time">—</div></div><script>
const W=window.TelegramWidget;let S={r:0,q:[],t:0,f:null},page=0;
function text(id,t){document.getElementById(id).textContent=t;}
function add(tag,parent,cls,id){const e=document.createElement(tag);if(cls)e.className=cls;if(id)e.id=id;parent.appendChild(e);return e;}
const rows=document.getElementById('rows');
for(let i=0;i<5;i++){const row=add('div',rows,'row');const left=add('div',row,'left');add('span',left,'badge','b'+i);const info=add('div',left);add('b',info,'name','n'+i);add('small',info,'','s'+i);const right=add('div',row,'right');add('b',right,'','p'+i);add('small',right,'','c'+i);}
function clock(t){const d=new Date(t*1000);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>('0'+n).slice(-2)).join(':');}
function draw(){for(let i=0;i<5;i++){const q=S.q[page*5+i];text('n'+i,q?(q[1]||q[2]):'—');text('s'+i,q?'#'+q[3]+' · '+q[2]:'');text('p'+i,q?'$ '+q[4]:'—');text('c'+i,q?q[5]+' за 24 ч':'');document.getElementById('c'+i).className=q?(q[6]?'up':'down'):'';text('b'+i,q?q[2].slice(0,1):'');document.getElementById('b'+i).style.backgroundColor=q?['#b57412','#7063ad','#187c75','#45678e','#ae556a','#627b37'][q[0]%6]:'#45678e';}text('page',(page+1)+' / 2');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===1;text('fx',S.f?'₽ '+S.f:'—');text('time',S.t?'Получено '+clock(S.t):'—');}
document.getElementById('prev').onclick=function(){page=0;draw();};document.getElementById('next').onclick=function(){page=1;draw();};function receive(){try{const n=JSON.parse(W.publicData||'null');if(n&&n.r>=S.r)S=n;}catch(e){}draw();}W.onEvent('publicDataChanged',receive);W.watchPublicData();receive();setInterval(draw,1000);
</script>
